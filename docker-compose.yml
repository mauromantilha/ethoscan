services:
  # Garante que ./artifacts pertence ao UID da API non-root (1000).
  artifacts-init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - ./artifacts:/artifacts
    command: ["sh", "-c", "mkdir -p /artifacts && chown -R 1000:1000 /artifacts"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethoscan
      POSTGRES_PASSWORD: ethoscan
      POSTGRES_DB: ethoscan
    ports:
      # dado sensível: publica só no loopback do host, em porta que não colide
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ethoscan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethoscan -d ethoscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Redis DEDICADO do Ethoscan (fila de jobs + flags de cancelamento).
    # Sem porta no host: apenas a rede interna do compose fala com ele.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ethoscan_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # ETHOSCAN_API_KEY, ETHOSCAN_LOCAL_* (hash bcrypt), logs... vêm daqui, sem
      # interpolação do compose (essencial para hash bcrypt, que contém "$")
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ethoscan:ethoscan@postgres:5432/ethoscan
      REDIS_URL: redis://redis:6379/0
      # Base = lab local. O override remote/publicação define ETHOSCAN_MODE=remote.
      ETHOSCAN_MODE: local
      # Fail-closed: mock só com opt-in explícito no .env.
      ETHOSCAN_ALLOW_MOCK: ${ETHOSCAN_ALLOW_MOCK:-false}
      ETHOSCAN_ARTIFACTS_DIR: /app/artifacts
      ETHOSCAN_CORS_ORIGINS: ${ETHOSCAN_CORS_ORIGINS:-http://localhost:3000}
      # API publicada na rede => auth ligada por padrão (login local e/ou X-API-Key)
      ETHOSCAN_DISABLE_AUTH: ${ETHOSCAN_DISABLE_AUTH:-false}
      ETHOSCAN_API_KEY: ${ETHOSCAN_API_KEY:-}
      ETHOSCAN_LOG_LEVEL: ${ETHOSCAN_LOG_LEVEL:-INFO}
      ETHOSCAN_LOG_FORMAT: ${ETHOSCAN_LOG_FORMAT:-text}
    ports:
      # API_BIND=0.0.0.0 libera para a rede local (desktop de outra máquina)
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      # relatórios HTML/PDF ficam visíveis no host
      - ./artifacts:/app/artifacts
    # API non-root; grupo root para escrever em artefactos criados pelo worker.
    group_add:
      - "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # sem --reload (reload mataria jobs em execução): rebuild para aplicar código novo
    # --proxy-headers: atrás de proxy reverso (Caddy/nginx/Tunnel) o client real vai nos logs/audit
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Scanners raw (nmap/masscan) precisam de root + NET_RAW/NET_ADMIN.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - DAC_OVERRIDE
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ethoscan:ethoscan@postgres:5432/ethoscan
      REDIS_URL: redis://redis:6379/0
      ETHOSCAN_MODE: local
      ETHOSCAN_ALLOW_MOCK: ${ETHOSCAN_ALLOW_MOCK:-false}
      ETHOSCAN_ARTIFACTS_DIR: /app/artifacts
      ETHOSCAN_LOG_LEVEL: ${ETHOSCAN_LOG_LEVEL:-INFO}
      ETHOSCAN_LOG_FORMAT: ${ETHOSCAN_LOG_FORMAT:-text}
      # ID estável para recuperar jobs órfãos após crash/restart.
      ETHOSCAN_WORKER_ID: ${ETHOSCAN_WORKER_ID:-worker-1}
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # Limite single-node: 1 worker processa 1 job de cada vez; a API permanece responsiva.
    # stop_grace_period dá tempo ao job atual antes do SIGKILL; órfãos são recuperados no restart.
    stop_grace_period: 10m
    # umask 0002: ficheiros do worker no grupo root, graváveis pela API (group_add 0).
    command: ["sh", "-c", "umask 0002 && python -m app.worker"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são embutidos no bundle no build: mudar exige `docker compose build web`
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${ETHOSCAN_API_KEY:-}
    restart: unless-stopped
    ports:
      # a UI embute a NEXT_PUBLIC_API_KEY no JS: por padrão fica só no loopback.
      # WEB_BIND=0.0.0.0 publica para a rede local (aceite o risco do bundle).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ethoscan_pg:
  ethoscan_redis:
