services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ethoscan
      POSTGRES_PASSWORD: ethoscan
      POSTGRES_DB: ethoscan
    ports:
      - "5432:5432"
    volumes:
      - ethoscan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethoscan -d ethoscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ethoscan:ethoscan@postgres:5432/ethoscan
      REDIS_URL: redis://redis:6379/0
      ETHOSCAN_MODE: local
      ETHOSCAN_ALLOW_MOCK: "true"
      ETHOSCAN_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  ethoscan_pg:
